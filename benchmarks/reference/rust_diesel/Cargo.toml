[package]
name = "opheap_bench_diesel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
diesel = { version = "2", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

[profile.release]
opt-level = 3
