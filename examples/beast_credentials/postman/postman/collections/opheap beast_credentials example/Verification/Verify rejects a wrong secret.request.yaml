$kind: http-request
url: "{{baseUrl}}/v1/credentials/verify"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"principal":"{{primaryPrincipal}}","secret":"definitely wrong secret"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status code is 401', function () { pm.response.to.have.status(401); });
      pm.collectionVariables.set('wrongSecretCode', pm.response.code);
      pm.collectionVariables.set('wrongSecretBody', pm.response.text());
    language: text/javascript
order: 2000
