$kind: http-request
url: "{{baseUrl}}/v1/credentials"
method: POST
headers:
  Content-Type: application/json
  X-Admin-Token: "{{adminToken}}"
body:
  type: text
  content: '{"principal":"{{rateLimitPrincipal}}","secret":"{{primarySecret}}"}'
scripts:
  - type: afterResponse
    code: pm.test('status code is 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 1000
