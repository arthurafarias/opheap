name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -DOPHEAP_BUILD_TESTS=ON -DOPHEAP_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-asan -DOPHEAP_BUILD_TESTS=ON -DOPHEAP_BUILD_EXAMPLES=OFF -DOPHEAP_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-asan --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-asan --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: pip install --user gcovr
      - name: Configure
        run: cmake -S . -B build-coverage -DOPHEAP_BUILD_TESTS=ON -DOPHEAP_BUILD_EXAMPLES=OFF -DOPHEAP_BUILD_APPLICATIONS=OFF -DOPHEAP_ENABLE_COVERAGE=ON
      - name: Build and run coverage
        run: cmake --build build-coverage --target coverage --parallel 2 | tee coverage-summary.txt
      - name: Write job summary
        run: |
          {
            echo '## Coverage'
            echo '```'
            tail -n 3 coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Flag stale docs/coverage
        run: |
          if ! git diff --quiet -- docs/coverage; then
            echo "::warning::docs/coverage is stale for this commit; regenerate with 'cmake --build <build-dir> --target coverage' (requires -DOPHEAP_ENABLE_COVERAGE=ON) and commit the result."
          fi
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: docs/coverage
